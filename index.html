function cHorario(p){
  const h=horarioDe(p),hs=h.horas.filter(x=>!x.recreo),cl=[...h.clases];while(cl.length<6)cl.push({dia:'',hora:''});

function textoCalculoAuto(p){
  const r=reglas(p),b=p.curso==='1BACH',bmax=Math.max(...Object.values(r.bonus)),pd=r.peso_diaria,pr=100-pd,pa=r.peso_actuacion;
  let t=`Cada día valoro tu trabajo en clase con un color: cuanto más lleno está el círculo, mejor ha sido tu trabajo. Al final de cada evaluación valoro también cómo has desempeñado cada uno de tus roles en el musical.\nTu nota de cada evaluación se compone de:\n· Un ${100-pa} % de la parte de clase: un ${pd} % de tu trabajo diario y un ${pr} % de la valoración de tus roles. Cada rol aporta puntos según su importancia y, si tienes varios, se suman, hasta un máximo de 10.\n· Un ${pa} % de la actuación de la evaluación (si hay dos, se reparte a partes iguales). La nota de la actuación es la misma para todo el grupo, sea cual sea tu rol. Si faltas sin justificar, es un 0; si lo justificas, tu nota se calcula solo con la parte de clase, salvo que acordemos un trabajo para recuperarla.\nLas faltas de asistencia sin justificar restan ${fmt(r.falta_sj_resta)} puntos cada una. Las justificadas no restan hasta la tercera de una evaluación y, a partir de ahí, restan de forma progresiva.\nLa nota final del curso es la media de las tres evaluaciones (${r.pesos_eval.join(' %, ')} %).`;
  t+=b?`\nEl ensayo en el Teatro Vico cuenta dentro de la 3ª evaluación. Además, la función del Teatro Vico supone un ${r.vico_peso} % de tu nota final: la media de las tres evaluaciones es el ${100-r.vico_peso} % restante. Participar es obligatorio: si faltas a la función sin justificar, tu nota final no puede superar ${r.vico_tope}.`:`\nSi participas en el montaje y desmontaje del Teatro Vico, tu nota de la 3ª evaluación puede subir hasta ${fmt(bmax)} punto(s), según tu trabajo ese día.`;
  return t;
}
