<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producción Escénica</title>
    <!-- Librerías públicas via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --brand: #4f46e5;
            --brand2: #4338ca;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            transition: background 0.3s, color 0.3s;
        }
        
        /* MODO OSCURO */
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --line: #334155;
            --brand: #6366f1;
            --brand2: #818cf8;
        }
        body.dark input, body.dark select, body.dark textarea { background: #334155; color: #f8fafc; border-color: #475569; }
        body.dark th { background: #0f172a; }
        body.dark .btn.sec { background: #334155; color: #f8fafc; }
        body.dark .btn.sec:hover { background: #475569; }
        body.dark .pill { background: #334155; color: #cbd5e1; }
        body.dark tr:hover { background: #1e293b; }
        body.dark details { background: var(--card); border-color: #475569; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 12px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            flex-wrap: wrap;
        }
        .topbar button, .topbar .btn {
            background: #f1f5f9;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .topbar button:hover, .topbar .btn:hover { background: #e2e8f0; }
        body.dark .topbar button, body.dark .topbar .btn { background: #334155; color: #fff; border-color: #475569; }
        body.dark .topbar button:hover { background: #475569; }
        
        #topbar-title {
            font-weight: 800;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--brand);
            min-width: 150px;
        }
        main { max-width: 1050px; margin: 0 auto; padding: 24px 18px 80px; }
        h1 { font-size: 24px; margin: 6px 0 18px; font-weight: 800; }
        h2 { font-size: 16px; margin: 24px 0 12px; color: var(--brand); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.02); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.02); }
        .pcard h3 { margin: 0; font-size: 18px; font-weight: 700; }
        .muted { color: var(--muted); font-size: 13px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--brand); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn:hover { background: var(--brand2); }
        .btn.sec { background: #f1f5f9; color: var(--ink); border: 1px solid var(--line); }
        .btn.sec:hover { background: #e2e8f0; }
        .btn.danger { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }
        .btn.danger:hover { background: #fecaca; }
        body.dark .btn.danger { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
        .btn.sm { padding: 6px 12px; font-size: 12px; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        details { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
        details summary { cursor: pointer; font-weight: 700; color: var(--brand); outline: none; }
        form { display: grid; gap: 12px; margin-top: 12px; }
        .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
        input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; color: var(--ink); width: 100%; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        textarea { min-height: 80px; resize: vertical; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; font-size: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.02); }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
        th { background: #f8fafc; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f8fafc; }
        .chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .c-green { background: #d1fae5; color: #065f46; }
        .c-yellow { background: #fef3c7; color: #92400e; }
        .c-red { background: #fee2e2; color: #991b1b; }
        body.dark .c-green { background: #064e3b; color: #6ee7b7; }
        body.dark .c-yellow { background: #78350f; color: #fcd34d; }
        body.dark .c-red { background: #7f1d1d; color: #fca5a5; }
        .pill { display: inline-block; padding: 4px 10px; border-radius: 6px; background: #f1f5f9; font-size: 12px; font-weight: 600; color: var(--muted); }
        a { color: var(--brand); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        .search-box { margin-bottom: 16px; }
        @media(max-width:600px){ th, td { padding: 8px 10px; font-size: 13px; } }
    </style>
</head>
<body>

<header class="topbar" id="topbar">
  <button id="btn-home">⌂ Proyectos</button>
  <span id="topbar-title">Registro de Producción Escénica</span>
  <button id="btn-sync" title="Sincronizar con Supabase">🔄 Sincronizar</button>
  <button id="btn-export-json" title="Exportar copia JSON">💾 Backup</button>
  <button id="btn-import-json" title="Importar copia JSON">📂 Cargar</button>

  <button id="btn-theme" title="Cambiar tema">🌙</button>

<main id="app"></main>

<script>
// CONFIGURACIÓN DE SUPABASE
const SUPABASE_URL = 'https://uaqktciswfjzcorrevrh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JoSi5-B_NIAD12NDtpaSQw_Yxp6HMbj';
let supabaseClient = null;

if (window.supabase) {
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) { console.error('Error al conectar con Supabase:', e); }
}

const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID();
const hoy = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const colorClass = n => n >= 8 ? 'c-green' : n >= 5 ? 'c-yellow' : 'c-red';

const STORAGE_KEY = 'prod_escenica_hybrid_db';

let DB = {
  proyectos: [], alumnos: [], roles: [], asignaciones: [],
  eventos: [], faltas: [], ajustes: [], colaboraciones: []
};

let view = { name: 'proyectos', proyectoId: null, alumnoId: null };
let alumnoFiltroBusqueda = '';

const ROLES_DEFECTO = [
  ['Actor principal', 3], ['Coreógrafo', 3], ['Actor secundario', 2], ['Bailarín', 2],
  ['Escenógrafo', 1.5], ['Vestuario', 1.5], ['Regidor', 1.5], ['Guionista', 1.5],
  ['Prensa y cartelería', 1.5], ['Técnico', 1], ['Extra', 1], ['Tramoya (día de función)', 2]
];

const TIPO_EVENTO = { solidario: 'Solidario', presentacion: 'Presentación', preestreno: 'Preestreno', estreno: 'Estreno', bolo: 'Bolo', otro: 'Otro' };

const initTheme = () => {
  if (localStorage.getItem('prod_theme') === 'dark') {
    document.body.classList.add('dark');
    $('#btn-theme').textContent = '☀️';
  }
};

$('#btn-theme').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('prod_theme', isDark ? 'dark' : 'light');
  $('#btn-theme').textContent = isDark ? '☀️' : '🌙';
});

// BACKUP JSON
$('#btn-export-json').addEventListener('click', () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
  const anchor = document.createElement('a');
  anchor.setAttribute("href", dataStr);
  anchor.setAttribute("download", `backup_produccion_escenica_${hoy()}.json`);
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
});

$('#btn-import-json').addEventListener('click', () => {
  $('#input-import-file').click();
});

$('#input-import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const importedData = JSON.parse(evt.target.result);
      if (importedData && typeof importedData === 'object' && Array.isArray(importedData.proyectos)) {
        DB = importedData;
        saveLocal();
        render();
        alert('Copia de seguridad importada correctamente.');
      } else {
        alert('Formato de copia de seguridad no válido.');
      }
    } catch (err) { alert('Error al cargar el archivo JSON.'); }
  };
  reader.readAsText(file);
});

// CARGA DE DATOS HÍBRIDA (Cloud + Local)
async function loadData() {
  $('#app').innerHTML = '<div class="card" style="text-align:center;padding:40px;">Cargando datos...</div>';
  let loadedFromCloud = false;

  if (supabaseClient) {
    try {
      const [p, a, r, asg, e, f, aj, c] = await Promise.all([
        supabaseClient.from('proyectos').select('*').order('created_at', { ascending: true }),
        supabaseClient.from('alumnos').select('*'),
        supabaseClient.from('roles').select('*'),
        supabaseClient.from('asignaciones').select('*'),
        supabaseClient.from('eventos').select('*'),
        supabaseClient.from('faltas').select('*'),
        supabaseClient.from('ajustes').select('*'),
        supabaseClient.from('colaboraciones').select('*')
      ]);

      if (!p.error) {
        DB.proyectos = p.data || [];
        DB.alumnos = a.data || [];
        DB.roles = r.data || [];
        DB.asignaciones = asg.data || [];
        DB.eventos = e.data || [];
        DB.faltas = f.data || [];
        DB.ajustes = aj.data || [];
        DB.colaboraciones = c.data || [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        loadedFromCloud = true;
      }
    } catch (err) {
      console.warn("Supabase no alcanzable, cargando LocalStorage...", err);
    }
  }

  if (!loadedFromCloud) {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) {
      try { DB = JSON.parse(local); } catch(e){}
    }
  }

  render();
}

function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
}

// CÁLCULOS MATEMÁTICOS DE CALIFICACIÓN
function calcAlumno(p, a) {
  const asg = DB.asignaciones.filter(x => x.alumno_id === a.id);
  let pts = 0;
  const detalle = asg.map(x => {
    const rol = DB.roles.find(r => r.id === x.rol_id);
    const peso = rol ? Number(rol.peso_base) || 0 : 0;
    const fi = x.intensidad === 'principal' ? 1 : x.intensidad === 'secundario' ? 0.6 : 0.3;
    const fv = x.valoracion === 'bien' ? 1 : x.valoracion === 'aceptable' ? 0.5 : 0;
    const pto = peso * fi * fv;
    pts += pto;
    return { ...x, rolNombre: rol ? rol.nombre : '(rol borrado)', peso, pto };
  });
  const faltasNJ = DB.faltas.filter(f => f.alumno_id === a.id && !f.justificada).length;
  const penal = faltasNJ * (Number(p.penalizacion_falta) || 0);
  return { asg: detalle, pts: Math.max(0, pts - penal), faltasNJ, penal };
}

function calcGrupo(p) {
  const als = DB.alumnos.filter(a => a.proyecto_id === p.id);
  const base = als.map(a => ({ alumno: a, ...calcAlumno(p, a) }));
  const maxPts = base.length ? Math.max(...base.map(b => b.pts)) : 0;
  const techo = Number(p.techo_referencia) || 12;
  const pr = Number(p.peso_roles) || 0.7, pa = Number(p.peso_ajuste) || 0.3;
  return base.map(b => {
    const notaTecho = Math.min(10, (b.pts / techo) * 10);
    const notaNorm = maxPts > 0 ? (b.pts / maxPts) * 10 : 0;
    const aj = DB.ajustes.find(x => x.alumno_id === b.alumno.id);
    const ajN = aj && aj.nota !== undefined && aj.nota !== '' ? Number(aj.nota) : null;
    const finalTecho = ajN === null ? notaTecho : pr * notaTecho + pa * ajN;
    const finalNorm = ajN === null ? notaNorm : pr * notaNorm + pa * ajN;
    return { ...b, notaTecho, notaNorm, ajuste: ajN, finalTecho, finalNorm };
  });
}

function eventoNombre(p, id) {
  if (!id) return '—';
  const e = DB.eventos.find(x => x.id === id);
  return e ? e.nombre : '—';
}

// EXPORTACIÓN A PDF / IMPRESIÓN CON JSPDF
function exportarAlumnoPDF(p, a) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const c = calcAlumno(p, a);

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(79, 70, 229);
  doc.text("FICHA INDIVIDUAL DE EVALUACIÓN", 14, 20);

  doc.setFontSize(14);
  doc.setTextColor(15, 23, 42);
  doc.text(a.nombre.toUpperCase(), 14, 28);

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text(`Proyecto: ${p.nombre} | Curso: ${a.curso || ''} ${a.grupo || ''} | Fecha: ${hoy()}`, 14, 34);

  doc.setDrawColor(226, 232, 240);
  doc.line(14, 38, 196, 38);

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(79, 70, 229);
  doc.text("ROLES Y PARTICIPACIÓN", 14, 46);

  let y = 52;
  doc.setFillColor(241, 245, 249);
  doc.rect(14, y, 182, 7, 'F');
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(51, 65, 85);
  doc.text("ROL", 16, y + 5);
  doc.text("INTENSIDAD", 70, y + 5);
  doc.text("VALORACIÓN", 110, y + 5);
  doc.text("OBSERVACIONES", 150, y + 5);

  y += 7;
  doc.setFont("Helvetica", "normal");

  if (c.asg.length === 0) {
    doc.text("Sin roles asignados", 16, y + 6);
    y += 10;
  } else {
    c.asg.forEach((x) => {
      doc.text(String(x.rolNombre).substring(0, 28), 16, y + 5);
      doc.text(String(x.intensidad), 70, y + 5);
      doc.text(String(x.valoracion), 110, y + 5);
      doc.text(String(x.notas || '—').substring(0, 20), 150, y + 5);
      y += 7;
    });
  }

  y += 5;
  if (c.faltasNJ > 0) {
    doc.setFont("Helvetica", "bold");
    doc.setTextColor(220, 38, 38);
    doc.text(`Faltas no justificadas registradas: ${c.faltasNJ}`, 14, y);
    y += 8;
  }

  if (a.notas_ficha) {
    doc.setFont("Helvetica", "bold");
    doc.setTextColor(79, 70, 229);
    doc.text("OBSERVACIONES GENERALES", 14, y + 4);
    y += 10;
    doc.setFont("Helvetica", "normal");
    doc.setTextColor(15, 23, 42);
    const splitNotes = doc.splitTextToSize(a.notas_ficha, 180);
    doc.text(splitNotes, 14, y);
  }

  doc.save(`Ficha_${a.nombre.replace(/\s+/g, '_')}.pdf`);
}

function exportarComparativaPDF(p) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const g = calcGrupo(p);
  const metodo = p.metodo_nota || 'techo';

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(79, 70, 229);
  doc.text(`COMPARATIVA GENERAL · ${p.nombre.toUpperCase()}`, 14, 18);

  doc.setFontSize(9);
  doc.setFont("Helvetica", "normal");
  doc.setTextColor(100, 116, 139);
  doc.text(`Método activo: ${metodo} | Techo ref: ${p.techo_referencia} | Pesos: ${p.peso_roles}/${p.peso_ajuste} | Penalización falta: ${p.penalizacion_falta} | ${hoy()}`, 14, 24);

  let y = 30;
  doc.setFillColor(241, 245, 249);
  doc.rect(14, y, 269, 7, 'F');
  doc.setFont("Helvetica", "bold");
  doc.setTextColor(51, 65, 85);
  doc.text("ALUMNO", 16, y + 5);
  doc.text("PUNTOS", 90, y + 5);
  doc.text("NOTA ROLES (TECHO)", 120, y + 5);
  doc.text("NOTA ROLES (NORM)", 170, y + 5);
  doc.text("AJUSTE", 220, y + 5);
  doc.text("FINAL", 250, y + 5);

  y += 7;
  doc.setFont("Helvetica", "normal");

  const orden = [...g].sort((x, y) => metodo === 'techo' ? y.finalTecho - x.finalTecho : y.finalNorm - x.finalNorm);

  orden.forEach((r) => {
    const finalVal = (metodo === 'techo' ? r.finalTecho : r.finalNorm).toFixed(1);
    doc.text(String(r.alumno.nombre).substring(0, 35), 16, y + 5);
    doc.text(r.pts.toFixed(1), 90, y + 5);
    doc.text(r.notaTecho.toFixed(1), 120, y + 5);
    doc.text(r.notaNorm.toFixed(1), 170, y + 5);
    doc.text(r.ajuste === null ? '—' : String(r.ajuste), 220, y + 5);
    doc.setFont("Helvetica", "bold");
    doc.text(finalVal, 250, y + 5);
    doc.setFont("Helvetica", "normal");
    y += 6.5;
  });

  doc.save(`Comparativa_${p.nombre.replace(/\s+/g, '_')}.pdf`);
}

// VISTAS SPA
function render() {
  const p = view.proyectoId ? DB.proyectos.find(x => x.id === view.proyectoId) : null;
  $('#topbar-title').textContent = p ? p.nombre : 'Registro de Producción Escénica';
  const app = $('#app');
  if (view.name === 'proyectos') app.innerHTML = renderProyectos();
  else if (view.name === 'proyecto') app.innerHTML = renderProyecto(p);
  else if (view.name === 'alumnos') app.innerHTML = renderAlumnos(p);
  else if (view.name === 'alumno') app.innerHTML = renderAlumno(p, DB.alumnos.find(a => a.id === view.alumnoId));
  else if (view.name === 'comparativa') app.innerHTML = renderComparativa(p);
  window.scrollTo(0, 0);
}

function renderProyectos() {
  return `<h1>Proyectos</h1>
  <details><summary>+ Nuevo proyecto</summary>
    <form data-action="crear-proyecto">
      <div class="grid2">
        <label>Nombre<input name="nombre" required placeholder="Burlesque 2026-27"></label>
        <label>Curso<select name="curso">
          <option value="4ESO">4º ESO</option><option value="1BACH">1º Bachillerato</option><option value="otro">Otro</option>
        </select></label>
        <label>Optativa<input name="optativa" placeholder="Creaciones escénico-musicales"></label>
        <label>Inicio<input type="date" name="fecha_inicio" value="${hoy()}"></label>
        <label>Fin<input type="date" name="fecha_fin"></label>
      </div>
      <div class="row"><button class="btn" type="submit">Crear proyecto</button></div>
    </form>
  </details>
  <div class="grid">
    ${DB.proyectos.length ? DB.proyectos.map(p => `
      <div class="pcard">
        <h3>${esc(p.nombre)}</h3>
        <div class="muted">${esc(p.curso)} ·${esc(p.optativa || '—')}</div>
        <div><span class="pill">${p.estado === 'activo' ? 'Activo' : 'Archivado'}</span></div>
        <div class="row" style="margin-top:auto;">
          <button class="btn sm" data-action="abrir-proyecto" data-id="${p.id}">Abrir</button>
          <button class="btn sm sec" data-action="archivar-proyecto" data-id="${p.id}">${p.estado === 'activo' ? 'Archivar' : 'Reactivar'}</button>
          <button class="btn sm danger" data-action="borrar-proyecto" data-id="${p.id}">Borrar</button>
        </div>
      </div>`).join('') : '<div class="card muted">Todavía no hay proyectos. Crea el primero arriba.</div>'}
  </div>`;
}

function renderAlumnos(p) {
  let als = DB.alumnos.filter(a => a.proyecto_id === p.id);
  
  if (alumnoFiltroBusqueda.trim()) {
    const q = alumnoFiltroBusqueda.toLowerCase().trim();
    als = als.filter(a => 
      (a.nombre || '').toLowerCase().includes(q) ||
      (a.curso || '').toLowerCase().includes(q) ||
      (a.grupo || '').toLowerCase().includes(q)
    );
  }

  const g = calcGrupo(p);
  const rows = als.map(a => {
    const r = g.find(x => x.alumno.id === a.id);
    const final = p.metodo_nota === 'normalizada' ? r.finalNorm : r.finalTecho;
    return `<tr>
      <td><a href="#" data-action="abrir-alumno" data-id="${a.id}">${esc(a.nombre)}</a></td>
      <td>${esc(a.curso || '')}</td>
      <td>${esc(a.grupo || '')}</td>
      <td><span class="pill">${r.asg.length}</span></td>

      <td><button class="btn sm danger" type="button" data-action="del-alumno" data-id="${a.id}">×</button></td>

  return `<h1>Alumnos · ${esc(p.nombre)}</h1>
  <div class="row" style="margin-bottom:16px">

function renderComparativa(p) {
  const g = calcGrupo(p);
  const metodo = p.metodo_nota || 'techo';
  const orden = [...g].sort((x, y) => metodo === 'techo' ? y.finalTecho - x.finalTecho : y.finalNorm - x.finalNorm);
  const filas = orden.map(r => `<tr>
    <td><a href="#" data-action="abrir-alumno" data-id="${r.alumno.id}">${esc(r.alumno.nombre)}</a></td>
    <td>${r.pts.toFixed(1)}</td>
    <td><span class="chip ${colorClass(r.notaTecho)}">${r.notaTecho.toFixed(1)}</span></td>
    <td><span class="chip ${colorClass(r.notaNorm)}">${r.notaNorm.toFixed(1)}</span></td>
    <td>${r.ajuste === null ? '—' : r.ajuste}</td>
    <td><span class="chip ${colorClass(r.finalTecho)}">${r.finalTecho.toFixed(1)} ${metodo === 'techo' ? '★' : ''}</span></td>
    <td><span class="chip ${colorClass(r.finalNorm)}">${r.finalNorm.toFixed(1)} ${metodo === 'normalizada' ? '★' : ''}</span></td>
  </tr>`).join('');
  return `<h1>Comparativa · ${esc(p.nombre)}</h1>
  <div class="row" style="margin-bottom:20px">
    <button class="btn sec" data-action="abrir-proyecto" data-id="${p.id}">← Volver al proyecto</button>
    <button class="btn sec" data-action="ver-alumnos">Alumnos</button>
    <button class="btn" data-action="pdf-comparativa" style="background:var(--ink);">📄 Descargar PDF Comparativa</button>
  </div>
  <div class="card muted" style="background:#f8fafc;">Método activo: <strong>${metodo}</strong> · Techo: ${p.techo_referencia} · Pesos: ${p.peso_roles} / ${p.peso_ajuste} · Penalización falta: ${p.penalizacion_falta}</div>
  ${g.length ? `<table><thead><tr><th>Alumno</th><th>Puntos</th><th>Nota roles (techo)</th><th>Nota roles (norm.)</th><th>Ajuste</th><th>Final (techo)</th><th>Final (norm.)</th></tr></thead><tbody>${filas}</tbody></table>` : '<div class="card muted">Sin alumnos.</div>'}
  <p class="muted" style="text-align:center;margin-top:20px;">Uso interno del profesorado. La ficha que se enseña al alumno es la individual, sin puntos ni comparativa.</p>`;
}

// EVENTOS Y EVENT LISTENERS
document.addEventListener('input', e => {
  if (e.target.id === 'input-search-alumno') {
    alumnoFiltroBusqueda = e.target.value;
    render();
    const input = $('#input-search-alumno');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  
  switch (act) {
    case 'home':
      view = { name: 'proyectos', proyectoId: null, alumnoId: null };
      render();
      break;
    case 'abrir-proyecto':
      view = { name: 'proyecto', proyectoId: id, alumnoId: null };
      render();
      break;
    case 'ver-alumnos':
      view = { name: 'alumnos', proyectoId: view.proyectoId, alumnoId: null };
      render();
      break;
    case 'ver-comparativa':
      view = { name: 'comparativa', proyectoId: view.proyectoId, alumnoId: null };
      render();
      break;
    case 'abrir-alumno':
      view = { name: 'alumno', proyectoId: view.proyectoId, alumnoId: id };
      render();
      break;
    case 'pdf-alumno':
      exportarAlumnoPDF(DB.proyectos.find(x => x.id === view.proyectoId), DB.alumnos.find(x => x.id === id));
      break;
    case 'pdf-comparativa':
      exportarComparativaPDF(DB.proyectos.find(x => x.id === view.proyectoId));
      break;
    
    case 'borrar-proyecto':
      if (confirm('¿Borrar el proyecto y todos sus datos?')) {
        DB.proyectos = DB.proyectos.filter(x => x.id !== id);
        DB.alumnos = DB.alumnos.filter(x => x.proyecto_id !== id);
        DB.roles = DB.roles.filter(x => x.proyecto_id !== id);
        DB.eventos = DB.eventos.filter(x => x.proyecto_id !== id);
        DB.asignaciones = DB.asignaciones.filter(x => x.proyecto_id !== id);
        DB.faltas = DB.faltas.filter(x => x.proyecto_id !== id);
        DB.ajustes = DB.ajustes.filter(x => x.proyecto_id !== id);
        DB.colaboraciones = DB.colaboraciones.filter(x => x.proyecto_id !== id);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('proyectos').delete().eq('id', id); } catch(e){} }
        view = { name: 'proyectos', proyectoId: null, alumnoId: null };
        render();
      }
      break;
    case 'archivar-proyecto': {
      const p = DB.proyectos.find(x => x.id === id);
      if (p) {
        p.estado = p.estado === 'activo' ? 'archivado' : 'activo';
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('proyectos').update({ estado: p.estado }).eq('id', id); } catch(e){} }
        render();
      }
      break;
    }
    case 'del-alumno':
      if (confirm('¿Borrar alumno y todos sus datos?')) {
        DB.alumnos = DB.alumnos.filter(x => x.id !== id);
        DB.asignaciones = DB.asignaciones.filter(x => x.alumno_id !== id);
        DB.faltas = DB.faltas.filter(x => x.alumno_id !== id);
        DB.ajustes = DB.ajustes.filter(x => x.alumno_id !== id);
        DB.colaboraciones = DB.colaboraciones.filter(x => x.alumno_id !== id);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('alumnos').delete().eq('id', id); } catch(e){} }
        render();
      }
      break;
    case 'del-asignacion':
      DB.asignaciones = DB.asignaciones.filter(x => x.id !== id);
      saveLocal();
      if (supabaseClient) { try { await supabaseClient.from('asignaciones').delete().eq('id', id); } catch(e){} }
      render();
      break;
    case 'del-falta':
      DB.faltas = DB.faltas.filter(x => x.id !== id);
      saveLocal();
      if (supabaseClient) { try { await supabaseClient.from('faltas').delete().eq('id', id); } catch(e){} }
      render();
      break;
    case 'del-evento':
      if (confirm('¿Borrar evento?')) {
        DB.eventos = DB.eventos.filter(x => x.id !== id);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('eventos').delete().eq('id', id); } catch(e){} }
        render();
      }
      break;
    case 'del-rol': {
      if (DB.asignaciones.some(x => x.rol_id === id)) {
        alert('No se puede borrar: hay asignaciones registradas con este rol.');
        break;
      }
      DB.roles = DB.roles.filter(x => x.id !== id);
      saveLocal();
      if (supabaseClient) { try { await supabaseClient.from('roles').delete().eq('id', id); } catch(e){} }
      render();
      break;
    }
    case 'add-rol-libre': {
      const n = DB.roles.filter(r => r.proyecto_id === view.proyectoId && r.es_libre).length + 1;
      const nuevoRol = { id: uid(), proyecto_id: view.proyectoId, nombre: 'Rol libre ' + n, peso_base: 1, es_libre: true };
      DB.roles.push(nuevoRol);
      saveLocal();
      if (supabaseClient) { try { await supabaseClient.from('roles').insert([nuevoRol]); } catch(e){} }
      render();
      break;
    }
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-rol-field]');
  if (!el) return;
  const val = el.dataset.rolField === 'peso_base' ? Number(el.value) : el.value;
  const rol = DB.roles.find(r => r.id === el.dataset.rolId);
  if (rol) {
    rol[el.dataset.rolField] = val;
    saveLocal();
    if (supabaseClient) {
      try { await supabaseClient.from('roles').update({ [el.dataset.rolField]: val }).eq('id', el.dataset.rolId); } catch(err){}
    }
    render();
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-action]');
  if (!f) return;
  e.preventDefault();
  const act = f.dataset.action;
  const fd = Object.fromEntries(new FormData(f).entries());
  const p = DB.proyectos.find(x => x.id === view.proyectoId);

  switch (act) {
    case 'crear-proyecto': {
      const pid = uid();
      const nuevoP = {
        id: pid, nombre: fd.nombre, curso: fd.curso, optativa: fd.optativa,
        fecha_inicio: fd.fecha_inicio, fecha_fin: fd.fecha_fin, estado: 'activo',
        techo_referencia: 12, metodo_nota: 'techo', peso_roles: 0.7, peso_ajuste: 0.3, penalizacion_falta: 0.5
      };
      DB.proyectos.push(nuevoP);

      const rolesAdd = ROLES_DEFECTO.map(r => ({ id: uid(), proyecto_id: pid, nombre: r[0], peso_base: r[1], es_libre: false }));
      rolesAdd.push({ id: uid(), proyecto_id: pid, nombre: 'Rol libre 1', peso_base: 1, es_libre: true });
      rolesAdd.push({ id: uid(), proyecto_id: pid, nombre: 'Rol libre 2', peso_base: 1, es_libre: true });
      DB.roles.push(...rolesAdd);
      
      saveLocal();
      if (supabaseClient) {
        try {
          await supabaseClient.from('proyectos').insert([nuevoP]);
          await supabaseClient.from('roles').insert(rolesAdd);
        } catch(e){}
      }
      
      view = { name: 'proyecto', proyectoId: pid, alumnoId: null };
      render();
      break;
    }
    case 'guardar-proyecto':
      if (p) {
        Object.assign(p, {
          nombre: fd.nombre, curso: fd.curso, optativa: fd.optativa,
          fecha_inicio: fd.fecha_inicio, fecha_fin: fd.fecha_fin, notas: fd.notas
        });
        saveLocal();
        if (supabaseClient) {
          try { await supabaseClient.from('proyectos').update({ nombre: fd.nombre, curso: fd.curso, optativa: fd.optativa, fecha_inicio: fd.fecha_inicio, fecha_fin: fd.fecha_fin, notas: fd.notas }).eq('id', p.id); } catch(e){}
        }
        render();
      }
      break;
    case 'guardar-ajustes':
      if (p) {
        Object.assign(p, {
          techo_referencia: Number(fd.techo_referencia), metodo_nota: fd.metodo_nota,
          peso_roles: Number(fd.peso_roles), peso_ajuste: Number(fd.peso_ajuste), penalizacion_falta: Number(fd.penalizacion_falta)
        });
        saveLocal();
        if (supabaseClient) {
          try { await supabaseClient.from('proyectos').update({ techo_referencia: Number(fd.techo_referencia), metodo_nota: fd.metodo_nota, peso_roles: Number(fd.peso_roles), peso_ajuste: Number(fd.peso_ajuste), penalizacion_falta: Number(fd.penalizacion_falta) }).eq('id', p.id); } catch(e){}
        }
        render();
      }
      break;
    case 'add-evento':
      if (p) {
        const nuevoEv = { id: uid(), proyecto_id: p.id, nombre: fd.nombre, tipo: fd.tipo, trimestre: fd.trimestre, fecha: fd.fecha, sede: fd.sede, formato: fd.formato, estado: fd.estado, notas: fd.notas };
        DB.eventos.push(nuevoEv);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('eventos').insert([nuevoEv]); } catch(e){} }
        render();
      }
      break;
    case 'add-alumno':
      if (p) {
        const nuevoAl = { id: uid(), proyecto_id: p.id, nombre: fd.nombre, curso: fd.curso, grupo: fd.grupo };
        DB.alumnos.push(nuevoAl);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('alumnos').insert([nuevoAl]); } catch(e){} }
        render();
      }
      break;
    case 'add-asignacion':
      if (p && view.alumnoId) {
        const nuevaAsg = { id: uid(), proyecto_id: p.id, alumno_id: view.alumnoId, rol_id: fd.rol_id, intensidad: fd.intensidad, valoracion: fd.valoracion, trimestre: fd.trimestre, evento_id: fd.evento_id || null, notas: fd.notas };
        DB.asignaciones.push(nuevaAsg);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('asignaciones').insert([nuevaAsg]); } catch(e){} }
        render();
      }
      break;
    case 'add-falta':
      if (p && view.alumnoId) {
        const nuevaFalta = { id: uid(), proyecto_id: p.id, alumno_id: view.alumnoId, fecha: fd.fecha, tipo: fd.tipo, justificada: (fd.justificada === 'si') };
        DB.faltas.push(nuevaFalta);
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('faltas').insert([nuevaFalta]); } catch(e){} }
        render();
      }
      break;
    case 'guardar-notas': {
      const a = DB.alumnos.find(x => x.id === view.alumnoId);
      if (a) {
        a.notas_privadas = fd.notas_privadas;
        a.notas_ficha = fd.notas_ficha;
        saveLocal();
        if (supabaseClient) { try { await supabaseClient.from('alumnos').update({ notas_privadas: fd.notas_privadas, notas_ficha: fd.notas_ficha }).eq('id', view.alumnoId); } catch(e){} }
        alert('Notas guardadas');
        render();
      }
      break;
    }
    case 'guardar-ajuste': {
      let aj = DB.ajustes.find(x => x.alumno_id === view.alumnoId);
      const notaVal = fd.nota !== '' ? Number(fd.nota) : '';
      if (!aj) {
        aj = { id: uid(), proyecto_id: p.id, alumno_id: view.alumnoId, nota: notaVal, comentario: fd.comentario };
        DB.ajustes.push(aj);
        if (supabaseClient) { try { await supabaseClient.from('ajustes').insert([aj]); } catch(e){} }
      } else {
        aj.nota = notaVal;
        aj.comentario = fd.comentario;
        if (supabaseClient) { try { await supabaseClient.from('ajustes').update({ nota: notaVal, comentario: fd.comentario }).eq('id', aj.id); } catch(e){} }
      }
      saveLocal();
      render();
      break;
    }
    case 'guardar-colab': {
      let c = DB.colaboraciones.find(x => x.alumno_id === view.alumnoId);
      if (!c) {
        c = { id: uid(), proyecto_id: p.id, alumno_id: view.alumnoId, estado: fd.estado, notas: fd.notas };
        DB.colaboraciones.push(c);
        if (supabaseClient) { try { await supabaseClient.from('colaboraciones').insert([c]); } catch(e){} }
      } else {
        c.estado = fd.estado;
        c.notas = fd.notas;
        if (supabaseClient) { try { await supabaseClient.from('colaboraciones').update({ estado: fd.estado, notas: fd.notas }).eq('id', c.id); } catch(e){} }
      }
      saveLocal();
      alert('Guardado');
      render();
      break;
    }
  }
});

$('#btn-home').addEventListener('click', () => {
  view = { name: 'proyectos', proyectoId: null, alumnoId: null };
  render();
});

$('#btn-sync').addEventListener('click', () => {
  loadData();
});

initTheme();
loadData();
