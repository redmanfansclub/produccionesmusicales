<script>
addEventListener('error',e=>aviso(e.message));addEventListener('unhandledrejection',e=>aviso((e.reason&&e.reason.message)||String(e.reason)));
function aviso(m){let b=document.getElementById('errb');if(!b){b=document.createElement('div');b.id='errb';b.className='warn r';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;margin:0;border-radius:0';document.body.prepend(b)}b.textContent='Error: '+m+'. Recarga la página; si persiste, avísame.'}
document.body.classList.toggle('light',(localStorage.getItem('pe_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'l':'d'))==='l');
/*<calc>*/
const COLORES=['verde','lima','amarillo','naranja','rojo'];
const REGLAS_DEF={
  rubrica:{verde:10,lima:8,amarillo:6,naranja:4,rojo:2},
  bonus:{verde:2,lima:1.5,amarillo:1,naranja:0.5,rojo:0},
  pesos_eval:[30,30,40],
  falta_sj_resta:0.5, falta_sj_cuenta_cero:true,
  escala_just:[0,0,0,0.5,0.7,1,1.5,2], mas_just_resta:0.5,
  aviso_amarillo:3, aviso_rojo:5,
  vico_peso:30, vico_tope:4, vico_tope_activo:true
};
let DB={proyectos:[],alumnos:[],roles:[],asignaciones:[],sesiones:[],marcas:[],eventos:[],vico:[],notas:[]};
function reglas(p){const r=(p&&p.reglas)||{};return {...REGLAS_DEF,...r,rubrica:{...REGLAS_DEF.rubrica,...(r.rubrica||{})},bonus:{...REGLAS_DEF.bonus,...(r.bonus||{})}}}
function penalJust(n,r){if(n<=2)return 0;const e=r.escala_just;return n<e.length?e[n]:e[e.length-1]+r.mas_just_resta*(n-(e.length-1))}
function calcEval(p,a,ev){
  const r=reglas(p);
  const ses=DB.sesiones.filter(s=>s.proyecto_id===p.id&&s.evaluacion===ev&&s.cerrada);
  let sum=0,n=0,fsj=0,fj=0;
  ses.forEach(s=>{
    const m=DB.marcas.find(x=>x.sesion_id===s.id&&x.alumno_id===a.id);const c=m?m.color:'verde';
    if(c==='falta_j'){fj++;return}
    if(c==='falta'){fsj++;if(r.falta_sj_cuenta_cero)n++;return}
    sum+=Number(r.rubrica[c]);n++;
  });
  const media=n?sum/n:10;
  const roles=DB.asignaciones.filter(x=>x.alumno_id===a.id).map(x=>{const ro=DB.roles.find(q=>q.id===x.rol_id)||{};return {nombre:ro.nombre||'(rol borrado)',valor:Number(ro['v'+ev]||0)*Number(x.factor??1)}});
  const base=roles.reduce((t,x)=>t+x.valor,0);
  const bruto=base*media/10;
  const pen=fsj*r.falta_sj_resta+penalJust(fj,r);
  const real=Math.max(0,bruto-pen);
  return {ses:ses.length,media,base,bruto,pen,real,nota:ses.length?Math.min(10,real):null,fsj,fj,roles};
}
function calcVico(p,a){
  const r=reglas(p);let vals=[],pend=false,sinJust=false,bon=[0,0];
  [1,2].forEach(f=>{
    const x=DB.vico.find(v=>v.alumno_id===a.id&&v.funcion===f);if(!x)return;
    if(x.color==='falta'){vals.push(0);sinJust=true;return}
    if(x.color==='falta_j'){if(x.valor_manual===null||x.valor_manual===undefined||x.valor_manual==='')pend=true;else vals.push(Number(x.valor_manual));return}
    vals.push(Number(r.rubrica[x.color]));bon[f-1]=Number(r.bonus[x.color]);
  });
  return {nota:vals.length?vals.reduce((t,v)=>t+v,0)/vals.length:null,pend,sinJust,bonus:(bon[0]+bon[1])/2,entradas:DB.vico.filter(v=>v.alumno_id===a.id).length};
}
function calcFinal(p,a){
  const r=reglas(p);
  const vico=calcVico(p,a);
  const ev=[1,2,3].map(e=>calcEval(p,a,e));
  let s=0,ws=0;
  ev.forEach((x,i)=>{if(x.ses>0){let n=x.nota;if(p.curso==='4ESO'&&i===2)n=Math.min(10,n+vico.bonus);x.notaFinalEv=n;s+=n*r.pesos_eval[i];ws+=r.pesos_eval[i]}});
  const clase=ws?s/ws:null;
  let final=clase,tope=false,vicoPend=false;
  if(p.curso==='1BACH'&&clase!==null){
    if(vico.nota!==null){final=(1-r.vico_peso/100)*clase+r.vico_peso/100*vico.nota}
    if(vico.pend)vicoPend=true;
    if(vico.sinJust&&r.vico_tope_activo&&final>r.vico_tope){final=r.vico_tope;tope=true}
  }
  return {ev,clase,final,vico,tope,vicoPend};
}

const SB_URL='https://uaqktciswfjzcorrevrh.supabase.co',SB_KEY='sb_publishable_JoSi5-B_NIAD12NDtpaSQw_Yxp6HMbj';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const TBL={proyectos:'pe_proyectos',alumnos:'pe_alumnos',roles:'pe_roles',asignaciones:'pe_asignaciones',sesiones:'pe_sesiones',marcas:'pe_marcas',eventos:'pe_eventos',vico:'pe_vico',notas:'pe_notas'};
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),hoy=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const fmt=n=>n===null||n===undefined?'—':(Math.round(n*10)/10).toString().replace('.',',');
const evDeFecha=f=>{const m=+f.slice(5,7);return m>=9?1:m<=3?2:3};
let auth={mode:'login',user:null},view={tab:'home',sub:'hoy',pid:null,aid:null,conf:'datos'};
let fecha=hoy(),evalSel=evDeFecha(hoy()),verVal=localStorage.getItem('pe_ver')==='1',modoAlumno=false;
const P=()=>DB.proyectos.find(p=>p.id===view.pid);
const ordAl=(x,y)=>(x.numero??1e9)-(y.numero??1e9)||x.nombre.localeCompare(y.nombre,'es');
const alumnosDe=p=>DB.alumnos.filter(a=>a.proyecto_id===p.id).sort(ordAl);
const titulo=s=>String(s).trim().toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const limpia=s=>String(s||'').replace(/["“”«»]/g,'').trim();
function parseAl(l){const m=l.match(/^\s*(\d+)[\s.\-;\t]+(.+)$/),num=m?+m[1]:null,r=(m?m[2]:l).split(/[;\t]/).map(x=>x.trim());return {numero:num,nombre:titulo(r[0]||''),grupo:r[1]||''}}
const nAl=a=>(a.numero?a.numero+'. ':'')+esc(a.nombre);
const rolesDe=p=>DB.roles.filter(r=>r.proyecto_id===p.id).sort((x,y)=>x.orden-y.orden);
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}
function fail(e){console.warn(e);const m=String(e.message||e);toast(/Load failed|Failed to fetch|NetworkError/i.test(m)?'No hay conexión con Supabase. Si usas Safari, prueba en ventana privada o desactiva extensiones y bloqueadores para esta web.':'No se pudo guardar: '+m,8000)}
async function ins(k,rows){const arr=Array.isArray(rows)?rows:[rows];arr.forEach(x=>x.id=x.id||uid());const {error}=await sb.from(TBL[k]).insert(arr);if(error){fail(error);return null}DB[k].push(...arr);return arr}
async function upd(k,id,patch){const {error}=await sb.from(TBL[k]).update(patch).eq('id',id);if(error){fail(error);return false}Object.assign(DB[k].find(x=>x.id===id),patch);return true}
async function del(k,id){const {error}=await sb.from(TBL[k]).delete().eq('id',id);if(error){fail(error);return false}DB[k]=DB[k].filter(x=>x.id!==id);return true}
async function loadData(){
  $('#app').innerHTML='<div class="card muted" style="text-align:center">Cargando…</div>';
  const keys=Object.keys(TBL);
  const res=await Promise.all(keys.map(k=>sb.from(TBL[k]).select('*')));
  const bad=res.find(r=>r.error);
  if(bad){$('#app').innerHTML=`<div class="card"><b>No se pudieron cargar los datos.</b><p class="muted">${esc(bad.error.message)}</p><p class="muted">¿Has ejecutado el archivo SQL en Supabase (y el de actualización A)?</p></div>`;return}
  keys.forEach((k,i)=>DB[k]=res[i].data||[]);
  DB.proyectos.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  render();
}

function renderLogin(msg=''){
  $('#top').innerHTML='';
  const m=auth.mode,t={login:'Acceso del profesorado',signup:'Crear cuenta',recover:'Recuperar contraseña',reset:'Nueva contraseña'}[m];
  $('#app').innerHTML=`<div class="card login"><h1 style="font-size:28px">Producciones Escénico-Musicales</h1><div class="muted" style="margin:4px 0 18px">by Manuel Esteve</div><h3 style="margin-bottom:12px">${t}</h3>
  ${msg?`<div class="warn">${esc(msg)}</div>`:''}
  <form id="fl">${m!=='reset'?'<label>Correo<input type="email" id="le" required autocomplete="email"></label>':''}
  ${m!=='recover'?`<label>${m==='reset'?'Nueva contraseña':'Contraseña'}<input type="password" id="lp" minlength="10" required autocomplete="${m==='login'?'current-password':'new-password'}"></label>`:''}
  <button class="btn gold" type="submit">${{login:'Entrar',signup:'Crear cuenta',recover:'Enviar enlace',reset:'Guardar contraseña'}[m]}</button></form>
  <div class="row" style="justify-content:center;margin-top:14px">${m==='login'?'<button class="btn sm" data-act="amode" data-v="signup">Crear cuenta</button><button class="btn sm" data-act="amode" data-v="recover">He olvidado la contraseña</button>':m==='reset'?'':'<button class="btn sm" data-act="amode" data-v="login">Volver</button>'}</div></div>`;
  $('#fl').onsubmit=async e=>{
    e.preventDefault();const em=$('#le')?.value.trim().toLowerCase(),pw=$('#lp')?.value;let r;
    try{
      if(m==='signup'){r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}});if(r.error)throw r.error;if(!r.data.session){auth.mode='login';return renderLogin('Cuenta creada. Confirma tu correo y entra.')}}
      else if(m==='login'){r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error}
      else if(m==='recover'){r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});if(r.error)throw r.error;auth.mode='login';return renderLogin('Si el correo existe, recibirás un enlace.')}
      else{r=await sb.auth.updateUser({password:pw});if(r.error)throw r.error;auth.mode='login';return renderLogin('Contraseña cambiada. Ya puedes entrar.')}
      await init();
    }catch(err){renderLogin(err.message||'No se pudo completar.')}
  };

  if(!data.session){auth.user=null;return renderLogin()}

function pintaBarra(){

  const tabs=p?[['dia','Día a día'],['alumnos','Alumnos'],['archivo','Archivo'],...(p.curso==='1BACH'?[['prod','Producción']]:[]),['eval','Evaluar']]:[];

    return `<div class="al ${as.length?'':'sinrol'}"><div class="t"><b style="font-size:16px">${nAl(a)}</b>${as.length?'':'<span class="chip r">Sin rol</span>'}</div>${as.map(x=>{const ro=DB.roles.find(q=>q.id===x.rol_id)||{};return `<div class="row" style="margin-bottom:6px"><span class="rol">${esc(ro.nombre||'?')} <small>${fmt(ro.v1)}</small></span><span style="flex:1"></span><select style="width:170px" data-chg="factor" data-id="${x.id}">${[[1,'Principal ×1'],[0.6,'Secundario ×0,6'],[0.3,'Puntual ×0,3']].map(([v,l])=>`<option value="${v}" ${Number(x.factor)===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn sm red" data-act="delasg" data-id="${x.id}">Quitar</button></div>`}).join('')}
    <select data-chg="addrol" data-a="${a.id}"><option value="">+ Añadir rol…</option>${rs.filter(r=>!as.some(x=>x.rol_id===r.id)).map(r=>`<option value="${r.id}">${esc(r.nombre)} (${fmt(r.v1)})</option>`).join('')}</select></div>`}).join('')||'<div class="card muted">Añade alumnos primero.</div>';
}
function cRoles(p){
  const rs=rolesDe(p);
  return `<div class="card muted">El valor es la nota que saca quien hace perfecto ese rol durante una evaluación. Cada evaluación tiene su propio valor, así que puedes cambiarlo en la siguiente sin tocar las anteriores.</div><div class="card scroll"><table><tr><th>Rol</th><th>Bloque</th><th>1ª</th><th>2ª</th><th>3ª</th><th></th></tr>${rs.map(r=>`<tr><td><input value="${esc(r.nombre)}" data-chg="rolf" data-id="${r.id}" data-f="nombre" style="min-width:160px"></td><td class="muted">${esc(r.bloque||'')}</td>${[1,2,3].map(e=>`<td><input type="number" step="0.5" min="0" value="${r['v'+e]}" data-chg="rolf" data-id="${r.id}" data-f="v${e}" style="width:76px"></td>`).join('')}<td><button class="btn sm red" data-act="delrol" data-id="${r.id}">Borrar</button></td></tr>`).join('')}</table></div>
  <form data-form="rol" class="card"><h3 style="font-size:18px">Nuevo rol</h3><div class="fg"><label>Nombre<input name="nombre" required></label><label>Bloque<input name="bloque" placeholder="Escena, Danza…"></label><label>Valor inicial<input type="number" step="0.5" name="valor" value="5"></label></div><div><button class="btn gold">Añadir rol</button></div></form>`;
}
function cReglas(p){
  const r=reglas(p),e=r.escala_just;
  const n=(name,l,v,st='0.1')=>`<label>${l}<input type="number" step="${st}" name="${name}" value="${v}"></label>`;
  return `<form data-form="reglas" class="card"><h3 style="margin-bottom:10px">Rúbrica de colores (solo la ves tú)</h3><div class="fg">${COLORES.map(c=>`<label><span class="row"><i class="sh c-${c}"></i> ${c}</span><input type="number" step="0.5" name="rub_${c}" value="${r.rubrica[c]}"></label>`).join('')}</div>
  <h3 style="margin:16px 0 10px">Peso de cada evaluación (%)</h3><div class="fg">${n('pe0','1ª',r.pesos_eval[0],'1')}${n('pe1','2ª',r.pesos_eval[1],'1')}${n('pe2','3ª (final)',r.pesos_eval[2],'1')}</div>
  <h3 style="margin:16px 0 10px">Faltas</h3><div class="fg">${n('sj_resta','Resta por falta sin justificar',r.falta_sj_resta)}<label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" name="sj_cero" ${r.falta_sj_cuenta_cero?'checked':''} style="width:auto;min-height:0"> La falta sin justificar cuenta como 0 en la media</label>${[3,4,5,6,7].map(i=>n('j'+i,'Resta con '+i+' justificadas',e[i])).join('')}${n('mas_j','Cada justificada más',r.mas_just_resta)}${n('av_a','Aviso amarillo desde',r.aviso_amarillo,'1')}${n('av_r','Aviso rojo desde',r.aviso_rojo,'1')}</div>
  <h3 style="margin:16px 0 10px">Teatro Vico</h3><div class="fg">${n('v_peso','Peso en la nota final de Bachillerato (%)',r.vico_peso,'1')}${n('v_tope','Tope si no va sin justificar',r.vico_tope)}<label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" name="v_tope_on" ${r.vico_tope_activo?'checked':''} style="width:auto;min-height:0"> Tope activo</label></div>
  <div class="muted" style="margin:10px 0 6px">Bonificación en 4º ESO por función</div><div class="fg">${COLORES.map(c=>`<label><span class="row"><i class="sh c-${c}"></i> ${c}</span><input type="number" step="0.5" name="bon_${c}" value="${r.bonus[c]}"></label>`).join('')}</div>
  <label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink);margin-top:14px"><input type="checkbox" name="ver" ${verVal?'checked':''} style="width:auto;min-height:0"> Ver los valores numéricos en los botones (solo en este dispositivo)</label>
  <div style="margin-top:12px"><button class="btn gold">Guardar reglas</button></div></form>`;
}
function cSim(p){
  const rs=rolesDe(p),r=reglas(p);
  return `<form data-form="sim" class="card"><h3 style="margin-bottom:10px">Simulador de notas</h3><div class="muted" style="margin-bottom:8px">Elige roles y un caso para ver qué nota saldría.</div><div class="fg">${rs.map(x=>`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="rol" value="${x.id}" style="width:auto;min-height:0"> ${esc(x.nombre)}</label>`).join('')}</div>
  <div class="fg" style="margin-top:12px"><label>Evaluación<select name="ev"><option>1</option><option>2</option><option>3</option></select></label><label>Color medio<select name="col">${COLORES.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Faltas sin justificar<input type="number" name="sj" value="0" min="0"></label><label>Faltas justificadas<input type="number" name="j" value="0" min="0"></label></div>
  <div style="margin-top:12px"><button class="btn gold">Calcular</button></div><div id="simres" style="margin-top:14px"></div></form>`;
}
/* ---------- acciones ---------- */
const ROLES_INI=[['Escena','Actor principal',10],['Escena','Actor secundario',7],['Escena','Extra',4],['Escena','Presentador/a',6],['Danza','Coreógrafo/a',10],['Danza','Bailarín/a',7],['Música','Intérprete en directo',10],['Producción','Regidor',5],['Producción','Guionista',5],['Producción','Ayudante de dirección',5],['Diseño y construcción','Escenógrafo',5],['Diseño y construcción','Vestuario',5],['Diseño y construcción','Técnico de decorados',4],['Diseño y construcción','Utilería y maquillaje',4],['Función','Técnico de sonido y luces',5],['Comunicación','Prensa, cartelería y redes',6],['Libre','Rol libre 1',5,true],['Libre','Rol libre 2',5,true]];
const rolesIni=pid=>ROLES_INI.map(([bl,n,v,l],i)=>({proyecto_id:pid,nombre:n,bloque:bl,v1:v,v2:v,v3:v,es_libre:!!l,orden:i}));
async function sesionDe(p){let s=DB.sesiones.find(x=>x.proyecto_id===p.id&&x.fecha===fecha);if(!s){const r=await ins('sesiones',{proyecto_id:p.id,fecha,evaluacion:evalSel,cerrada:false});s=r&&r[0]}return s}
const nextColor=(cur,c)=>c==='falta'?(cur==='falta'?'falta_j':cur==='falta_j'?null:'falta'):(cur===c?null:c);
function avisoSinRol(){if(view.tab!=='conf'||view.conf!=='reparto')return;const p=P();if(!p)return;const n=alumnosDe(p).filter(a=>!DB.asignaciones.some(x=>x.alumno_id===a.id)).length;if(n)toast(n+' alumno(s) siguen sin rol. Puedes dejarlo así o volver a Reparto de roles.',6000)}
const A={
  tema:()=>{const l=!document.body.classList.contains('light');document.body.classList.toggle('light',l);localStorage.setItem('pe_theme',l?'l':'d');render()},
  delnota:async el=>{if(confirm('¿Borrar esta anotación?')){await del('notas',el.dataset.id);render()}},
  normalizar:async()=>{const p=P(),cambios=[];alumnosDe(p).forEach(a=>{const m=a.nombre.match(/^\s*(\d+)[\s.\-]+(.+)$/),nombre=titulo(m?m[2]:a.nombre),numero=m?+m[1]:(a.numero??null);if(nombre!==a.nombre||numero!==(a.numero??null))cambios.push([a.id,{nombre,numero}])});
    if(!cambios.length)return toast('Ya está todo normalizado.');if(!confirm(`Se normalizarán ${cambios.length} alumno(s): el número pasa a su casilla y el nombre a minúsculas con inicial. ¿Continuar?`))return;
    await Promise.all(cambios.map(([id,pt])=>upd('alumnos',id,pt)));toast('Listo');render()},
  tab:el=>{avisoSinRol();view.tab=el.dataset.v;view.aid=null;render()},
  sub:el=>{view.sub=el.dataset.v;render()},
  conf:el=>{avisoSinRol();view.conf=el.dataset.v;render()},
  open:el=>{view={...view,tab:'dia',sub:'hoy',pid:el.dataset.id,aid:null};render()},
  logout:async()=>{await sb.auth.signOut()},
  amode:el=>{auth.mode=el.dataset.v;renderLogin()},
  evsel:async el=>{const e=+el.dataset.v,s=DB.sesiones.find(x=>x.proyecto_id===view.pid&&x.fecha===fecha);evalSel=e;if(s)await upd('sesiones',s.id,{evaluacion:e});render()},
  mark:async el=>{const p=P(),s=await sesionDe(p);if(!s)return;const aid=el.dataset.a,m=DB.marcas.find(x=>x.sesion_id===s.id&&x.alumno_id===aid),nc=nextColor(m?m.color:null,el.dataset.c);
    DB.marcas=DB.marcas.filter(x=>x!==m);
    if(!nc){render();if(m){const {error}=await sb.from('pe_marcas').delete().eq('id',m.id);if(error)fail(error)}return}
    const row={id:m?m.id:uid(),proyecto_id:p.id,sesion_id:s.id,alumno_id:aid,color:nc};DB.marcas.push(row);render();
    const {error}=await sb.from('pe_marcas').upsert(row,{onConflict:'sesion_id,alumno_id'});if(error)fail(error)},
  vmark:async el=>{const p=P(),aid=el.dataset.a,f=+el.dataset.f,x=DB.vico.find(v=>v.alumno_id===aid&&v.funcion===f),nc=nextColor(x?x.color:null,el.dataset.c);
    DB.vico=DB.vico.filter(v=>v!==x);
    if(!nc){render();if(x){const {error}=await sb.from('pe_vico').delete().eq('id',x.id);if(error)fail(error)}return}
    const row={id:x?x.id:uid(),proyecto_id:p.id,alumno_id:aid,funcion:f,color:nc,valor_manual:nc==='falta_j'&&x?x.valor_manual:null};DB.vico.push(row);render();
    const {error}=await sb.from('pe_vico').upsert(row,{onConflict:'alumno_id,funcion'});if(error)fail(error)},
  cerrar:async()=>{const p=P(),als=alumnosDe(p),s=await sesionDe(p);if(!s)return;const n=als.length-DB.marcas.filter(m=>m.sesion_id===s.id).length;
    if(confirm(`Se cierra el ${fecha}. ${n} alumno(s) sin marca contarán como verde. ¿Cerrar el día?`)){await upd('sesiones',s.id,{cerrada:true});toast('Día cerrado');render()}},
  reabrir:async()=>{const s=DB.sesiones.find(x=>x.proyecto_id===view.pid&&x.fecha===fecha);if(s){await upd('sesiones',s.id,{cerrada:false});render()}},
  delev:async el=>{if(confirm('¿Borrar el evento?')){await del('eventos',el.dataset.id);render()}},
  ficha:(el,e)=>{e.preventDefault();view.aid=el.dataset.id;modoAlumno=false;window.scrollTo(0,0);render()},
  back:()=>{view.aid=null;modoAlumno=false;render()},
  modo:()=>{modoAlumno=!modoAlumno;render()},
  print:()=>window.print(),
  arch:async el=>{const p=DB.proyectos.find(x=>x.id===el.dataset.id);await upd('proyectos',p.id,{estado:p.estado==='activo'?'archivado':'activo'});toast(p.estado==='archivado'?'Musical archivado':'Musical reactivado');render()},
  delp:async el=>{if(confirm('¿Borrar este musical y TODOS sus datos? No se puede deshacer.')){await del('proyectos',el.dataset.id);DB.alumnos=DB.alumnos.filter(x=>x.proyecto_id!==el.dataset.id);view={...view,tab:'home',pid:null};render()}},
  delal:async el=>{if(confirm('¿Borrar al alumno y todos sus datos?')){const id=el.dataset.id;await del('alumnos',id);['asignaciones','marcas','vico'].forEach(k=>DB[k]=DB[k].filter(x=>x.alumno_id!==id));render()}},
  delasg:async el=>{await del('asignaciones',el.dataset.id);render()},
  delrol:async el=>{if(DB.asignaciones.some(x=>x.rol_id===el.dataset.id))return toast('Hay alumnos con este rol. Quítaselo primero.');await del('roles',el.dataset.id);render()}
};
const C={
  fecha:el=>{fecha=el.value||hoy();const s=DB.sesiones.find(x=>x.proyecto_id===view.pid&&x.fecha===fecha);evalSel=s?s.evaluacion:evDeFecha(fecha);render()},
  vman:async el=>{await upd('vico',el.dataset.id,{valor_manual:el.value===''?null:num(el.value)});render()},
  rolf:async el=>{await upd('roles',el.dataset.id,{[el.dataset.f]:el.dataset.f==='nombre'?el.value:num(el.value)})},
  factor:async el=>{await upd('asignaciones',el.dataset.id,{factor:num(el.value)});render()},
  addrol:async el=>{if(!el.value)return;await ins('asignaciones',{proyecto_id:view.pid,alumno_id:el.dataset.a,rol_id:el.value,factor:1});render()}
};
const F={
  nuevo:async d=>{const r=await ins('proyectos',{nombre:limpia(d.nombre),curso:d.curso,optativa:d.curso==='4ESO'?'Creaciones escénico-musicales':'Música, espectáculo y comunicación',fecha_inicio:d.fecha_inicio||null,fecha_fin:d.fecha_fin||null,estado:'activo',reglas:{}});if(!r)return;await ins('roles',rolesIni(r[0].id));view={...view,tab:'conf',conf:'alumnos',pid:r[0].id};toast('Musical creado. Añade ahora los alumnos.');render()},
  datos:async d=>{if(await upd('proyectos',view.pid,{nombre:limpia(d.nombre),optativa:d.optativa,fecha_inicio:d.fecha_inicio||null,fecha_fin:d.fecha_fin||null,notas:d.notas})){toast('Guardado');render()}},
  evento:async d=>{if(await ins('eventos',{proyecto_id:view.pid,nombre:d.nombre,tipo:d.tipo,evaluacion:+d.evaluacion,fecha:d.fecha||null,sede:d.sede})){render()}},
  alumno:async d=>{if(await ins('alumnos',{proyecto_id:view.pid,numero:d.numero?+d.numero:null,nombre:titulo(d.nombre),grupo:d.grupo||''})){render()}},
  nota:async d=>{if(await ins('notas',{proyecto_id:view.pid,alumno_id:view.aid,fecha:d.fecha||hoy(),texto:d.texto.trim()})){render()}},
  importar:async d=>{const ya=new Set(DB.alumnos.filter(a=>a.proyecto_id===view.pid).map(a=>titulo(a.nombre.replace(/^\s*\d+[\s.\-]+/,'')).toLowerCase()));const rows=[];String(d.lista||'').split(/\r?\n/).forEach(l=>{const r=parseAl(l);if(r.nombre&&!ya.has(r.nombre.toLowerCase())){ya.add(r.nombre.toLowerCase());rows.push({proyecto_id:view.pid,...r})}});if(!rows.length)return toast('No hay alumnos nuevos.');if(await ins('alumnos',rows)){toast(rows.length+' alumno(s) importados');render()}},
  rol:async d=>{const v=num(d.valor),rs=rolesDe(P());if(await ins('roles',{proyecto_id:view.pid,nombre:d.nombre,bloque:d.bloque||'',v1:v,v2:v,v3:v,es_libre:true,orden:rs.length})){render()}},
  manual:async d=>{if(await upd('alumnos',view.aid,{nota_manual:d.nota_manual===''?null:num(d.nota_manual),comentario_manual:d.comentario_manual,notas_privadas:d.notas_privadas})){toast('Guardado');render()}},
  reglas:async d=>{const p=P(),r=reglas(p);const rub={},bon={};COLORES.forEach(c=>{rub[c]=num(d['rub_'+c]);bon[c]=num(d['bon_'+c])});
    const esc2=[...r.escala_just];[3,4,5,6,7].forEach(i=>esc2[i]=num(d['j'+i]));
    const nr={rubrica:rub,bonus:bon,pesos_eval:[num(d.pe0),num(d.pe1),num(d.pe2)],falta_sj_resta:num(d.sj_resta),falta_sj_cuenta_cero:!!d.sj_cero,escala_just:esc2,mas_just_resta:num(d.mas_j),aviso_amarillo:num(d.av_a),aviso_rojo:num(d.av_r),vico_peso:num(d.v_peso),vico_tope:num(d.v_tope),vico_tope_activo:!!d.v_tope_on};
    verVal=!!d.ver;localStorage.setItem('pe_ver',verVal?'1':'0');
    if(await upd('proyectos',p.id,{reglas:nr})){toast('Reglas guardadas');render()}},
  sim:(d,f)=>{const p=P(),r=reglas(p),ev=+d.ev,ids=[...f.querySelectorAll('input[name=rol]:checked')].map(x=>x.value);
    const base=ids.reduce((t,id)=>t+Number((DB.roles.find(q=>q.id===id)||{})['v'+ev]||0),0),media=r.rubrica[d.col],pen=num(d.sj)*r.falta_sj_resta+penalJust(num(d.j),r),real=Math.max(0,base*media/10-pen);
    $('#simres').innerHTML=`<div class="card"><div class="muted">Valor de los roles: ${fmt(base)} · color medio ${d.col} (${media}) · resta por faltas ${fmt(pen)}</div><div class="big">${fmt(Math.min(10,real))}</div><div class="muted">Trabajo real: ${fmt(real)}${real>10?' (matrícula)':''}</div></div>`},
  derivar:async(d,f)=>{const p=P(),ids=[...f.querySelectorAll('input[name=al]:checked')].map(x=>x.value);const r=await ins('proyectos',{nombre:d.nombre,curso:'1BACH',optativa:'Música, espectáculo y comunicación',estado:'activo',reglas:p.reglas||{},origen_id:p.id});if(!r)return;const np=r[0];
    await ins('roles',rolesDe(p).map(x=>({proyecto_id:np.id,nombre:x.nombre,bloque:x.bloque,v1:x.v1,v2:x.v2,v3:x.v3,es_libre:x.es_libre,orden:x.orden})));
    await ins('alumnos',ids.map(id=>{const a=DB.alumnos.find(q=>q.id===id);return {proyecto_id:np.id,nombre:a.nombre,grupo:a.grupo||''}}));
    view={...view,pid:np.id,tab:'conf',conf:'reparto'};toast('Proyecto de Bachillerato creado. Reparte los roles.');render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!A[el.dataset.act])return;if(el.tagName==='A')e.preventDefault();A[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form](Object.fromEntries(new FormData(f)),f)});
init();
</script>
