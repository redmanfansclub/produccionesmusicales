<script>
addEventListener('error',e=>aviso(e.message));addEventListener('unhandledrejection',e=>aviso((e.reason&&e.reason.message)||String(e.reason)));
function aviso(m){let b=document.getElementById('errb');if(!b){b=document.createElement('div');b.id='errb';b.className='warn r';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;margin:0;border-radius:0';document.body.prepend(b)}b.textContent='Error: '+m+'. Recarga la página; si persiste, avísame.'}
document.body.classList.toggle('light',(localStorage.getItem('pe_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'l':'d'))==='l');
if(!window.supabase){document.getElementById('app').innerHTML='<div class="card"><b>No se pudo cargar la librería de Supabase.</b><p class="muted">Un bloqueador de contenido o la red lo impide. Prueba en una ventana privada o con otra conexión.</p></div>';throw new Error('Supabase no cargó')}
/*<calc>*/
const COLORES=['verde','lima','amarillo','naranja','rojo'];
const REGLAS_DEF={
  rubrica:{verde:10,lima:8,amarillo:6,naranja:4,rojo:2},
  bonus:{verde:2,lima:1.5,amarillo:1,naranja:0.5,rojo:0},
  pesos_eval:[30,30,40],
  falta_sj_resta:0.5, falta_sj_cuenta_cero:true,
  escala_just:[0,0,0,0.5,0.7,1,1.5,2], mas_just_resta:0.5,
  aviso_amarillo:3, aviso_rojo:5,
  vico_peso:30, vico_w:[1,2], vico_tope:4, vico_tope_activo:true
};
let DB={proyectos:[],alumnos:[],roles:[],asignaciones:[],sesiones:[],marcas:[],eventos:[],vico:[],notas:[]};
function reglas(p){const r=(p&&p.reglas)||{};return {...REGLAS_DEF,...r,rubrica:{...REGLAS_DEF.rubrica,...(r.rubrica||{})},bonus:{...REGLAS_DEF.bonus,...(r.bonus||{})}}}
function penalJust(n,r){if(n<=2)return 0;const e=r.escala_just;return n<e.length?e[n]:e[e.length-1]+r.mas_just_resta*(n-(e.length-1))}
const asgEvs=x=>Array.isArray(x.evals)?x.evals.map(Number):[1,2,3];
function calcEval(p,a,ev){
  const r=reglas(p);
  const ses=DB.sesiones.filter(s=>s.proyecto_id===p.id&&s.evaluacion===ev&&s.cerrada&&!s.sin_clase);
  let sum=0,n=0,fsj=0,fsjW=0,fj=0;
  ses.forEach(s=>{
    const w=Number(s.peso??1);
    const m=DB.marcas.find(x=>x.sesion_id===s.id&&x.alumno_id===a.id);const c=m?m.color:'verde';
    if(c==='falta_j'){fj++;return}
    if(c==='falta'){fsj++;fsjW+=w;if(r.falta_sj_cuenta_cero)n+=w;return}
    sum+=Number(r.rubrica[c])*w;n+=w;
  });
  const media=n?sum/n:10;
  const roles=DB.asignaciones.filter(x=>x.alumno_id===a.id&&asgEvs(x).includes(ev)).map(x=>{const ro=DB.roles.find(q=>q.id===x.rol_id)||{};const ad=x.valor_adaptado!==null&&x.valor_adaptado!==undefined;return {nombre:ro.nombre||'(rol borrado)',valor:Number(ad?x.valor_adaptado:(ro['v'+ev]||0))*Number(x.factor??1),adaptado:ad}});
  const base=roles.reduce((t,x)=>t+x.valor,0);
  const bruto=base*media/10;
  const pen=fsjW*r.falta_sj_resta+penalJust(fj,r);
  const real=Math.max(0,bruto-pen);
  return {ses:ses.length,media,base,bruto,pen,real,nota:ses.length?Math.min(10,real):null,fsj,fj,roles};

function calcVico(p,a){
