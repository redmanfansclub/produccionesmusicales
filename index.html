<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producción Escénica</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#4f46e5;--brand2:#4338ca;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
        .topbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
        .topbar button,.topbar .btn{background:#f1f5f9;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
        .topbar button:hover,.topbar .btn:hover{background:#e2e8f0}
        #topbar-title{font-weight:800;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brand)}
        main{max-width:1050px;margin:0 auto;padding:24px 18px 80px}
        h1{font-size:24px;margin:6px 0 18px;font-weight:800}
        h2{font-size:16px;margin:24px 0 12px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
        .pcard h3{margin:0;font-size:18px;font-weight:700}
        .muted{color:var(--muted);font-size:13px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:0.2s}
        .btn:hover{background:var(--brand2)}
        .btn.sec{background:#f1f5f9;color:var(--ink);border:1px solid var(--line)}
        .btn.sec:hover{background:#e2e8f0}
        .btn.danger{background:#fee2e2;color:var(--red);border:1px solid #fecaca}
        .btn.danger:hover{background:#fecaca}
        .btn.sm{padding:6px 12px;font-size:12px}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        details{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
        details summary{cursor:pointer;font-weight:700;color:var(--brand);outline:none}
        form{display:grid;gap:12px;margin-top:12px}
        .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
        label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
        input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:var(--ink);width:100%;outline:none;transition:0.2s}
        input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
        textarea{min-height:80px;resize:vertical}
        table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
        th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
        th{background:#f8fafc;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
        tr:last-child td{border-bottom:none}
        tr:hover{background:#f8fafc}
        .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
        .c-green{background:#d1fae5;color:#065f46}
        .c-yellow{background:#fef3c7;color:#92400e}
        .c-red{background:#fee2e2;color:#991b1b}
        .pill{display:inline-block;padding:4px 10px;border-radius:6px;background:#f1f5f9;font-size:12px;font-weight:600;color:var(--muted)}
        a{color:var(--brand);text-decoration:none;font-weight:600}
        a:hover{text-decoration:underline}
        @media(max-width:600px){th,td{padding:8px 10px;font-size:13px}}
    </style>
</head>
<body>

<header class="topbar" id="topbar" style="display:none">
  <button id="btn-home">⌂ Proyectos</button>
  <span id="topbar-title">Registro de Producción Escénica</span>
  <button id="btn-logout" class="danger">Salir</button>
</header>
<main id="app"></main>

<script>
const SUPABASE_URL = 'https://uaqktciswfjzcorrevrh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JoSi5-B_NIAD12NDtpaSQw_Yxp6HMbj';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID();
const hoy = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const colorClass = n => n >= 8 ? 'c-green' : n >= 5 ? 'c-yellow' : 'c-red';

let DB = { proyectos:[], alumnos:[], roles:[], asignaciones:[], eventos:[], faltas:[], ajustes:[], colaboraciones:[] };
let view = { name:'proyectos', proyectoId:null, alumnoId:null };
let authSession = null;
let sessionEmail = null;
let authMode = 'login';

const ROLES_DEFECTO = [
  ['Actor principal',3],['Coreógrafo',3],['Actor secundario',2],['Bailarín',2],
  ['Escenógrafo',1.5],['Vestuario',1.5],['Regidor',1.5],['Guionista',1.5],
  ['Prensa y cartelería',1.5],['Técnico',1],['Extra',1],['Tramoya (día de función)',2]
];
const TIPO_EVENTO = {solidario:'Solidario',presentacion:'Presentación',preestreno:'Preestreno',estreno:'Estreno',bolo:'Bolo',otro:'Otro'};

async function loadData() {
  if (!authSession?.user?.id) { renderLogin(); return; }
  $('#app').innerHTML = '<div class="card" style="text-align:center;padding:40px;">Cargando datos...</div>';
  try {
    const p = await supabaseClient.from('proyectos').select('*').order('created_at');
    const a = await supabaseClient.from('alumnos').select('*');
    const r = await supabaseClient.from('roles').select('*');
    const asg = await supabaseClient.from('asignaciones').select('*');
    const e = await supabaseClient.from('eventos').select('*');
    const f = await supabaseClient.from('faltas').select('*');
    const aj = await supabaseClient.from('ajustes').select('*');
    const c = await supabaseClient.from('colaboraciones').select('*');

    const failed = [p,a,r,asg,e,f,aj,c].find(x => x.error);
    if (failed) throw failed.error;
    DB.proyectos = p.data || [];
    DB.alumnos = a.data || [];
    DB.roles = r.data || [];
    DB.asignaciones = asg.data || [];
    DB.eventos = e.data || [];
    DB.faltas = f.data || [];
    DB.ajustes = aj.data || [];
    DB.colaboraciones = c.data || [];
    render();
  } catch (err) {
    $('#app').innerHTML = `<div class="card" style="color:red">Error al cargar datos: ${esc(err.message)}<p>Comprueba que has ejecutado el SQL de configuración de propietarios y políticas RLS en Supabase.</p><button class="btn" onclick="location.reload()">Reintentar</button></div>`;
  }
}

function renderLogin(message = '') {
  $('#topbar').style.display = 'none';
  const recovery = authMode === 'recover';
  const reset = authMode === 'reset';
  const signup = authMode === 'signup';
  const title = reset ? 'Crear nueva contraseña' : recovery ? 'Recuperar contraseña' : signup ? 'Crear cuenta de profesor' : 'Acceso Profesorado';
  const description = reset ? 'Introduce una contraseña nueva para tu cuenta.' : recovery ? 'Te enviaremos un enlace al correo para restablecer tu contraseña.' : signup ? 'Registra tu correo y crea una contraseña para tus proyectos.' : 'Accede a tus proyectos de producción escénica.';
  const passwordFields = (!recovery) ? `<label style="text-align:left">${reset ? 'Nueva contraseña' : 'Contraseña'}<input type="password" id="login-password" minlength="10" autocomplete="${signup || reset ? 'new-password' : 'current-password'}" required placeholder="Mínimo 10 caracteres"></label>${signup ? `<label style="text-align:left">Repite la contraseña<input type="password" id="login-password2" minlength="10" autocomplete="new-password" required></label>` : ''}` : '';
  const buttonText = reset ? 'Guardar contraseña' : recovery ? 'Enviar enlace de recuperación' : signup ? 'Crear cuenta' : 'Entrar';
  $('#app').innerHTML = `
    <div class="card" style="max-width:430px;margin:60px auto;text-align:center;padding:40px 30px;">
      <div style="font-size:40px;margin-bottom:15px;">🎭</div>
      <h2 style="margin-top:0;color:var(--ink);text-transform:none;">${title}</h2>
      <p class="muted" style="margin-bottom:25px;">${description}</p>
      ${message ? `<div class="card" role="status" style="padding:10px;margin-bottom:14px;color:var(--brand);">${esc(message)}</div>` : ''}
      <form id="login-form">
        ${!reset ? `<label style="text-align:left">Correo electrónico<input type="email" id="login-email" autocomplete="email" placeholder="tu@correo.com" value="${esc(sessionEmail||'')}" required></label>` : ''}
        ${passwordFields}
        <button class="btn" type="submit" style="width:100%;margin-top:10px;">${buttonText}</button>
      </form>
      <div class="row" style="justify-content:center;margin-top:18px;">
        ${reset ? '' : recovery ? `<button class="btn sec sm" type="button" data-auth-mode="login">Volver al acceso</button>` : signup ? `<button class="btn sec sm" type="button" data-auth-mode="login">Ya tengo cuenta</button>` : `<button class="btn sec sm" type="button" data-auth-mode="signup">Crear cuenta</button><button class="btn sec sm" type="button" data-auth-mode="recover">He olvidado mi contraseña</button>`}
      </div>
    </div>`;
  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#login-email')?.value.trim().toLowerCase();
    const password = $('#login-password')?.value;
    const submit = $('#login-form').querySelector('button[type="submit"]');
    submit.disabled = true; submit.textContent = 'Procesando…';
    try {
      let result;
      if (authMode === 'signup') {
        if (password !== $('#login-password2').value) throw new Error('Las contraseñas no coinciden.');
        if (password.length < 10) throw new Error('La contraseña debe tener al menos 10 caracteres.');
        result = await supabaseClient.auth.signUp({ email, password, options: { emailRedirectTo: window.location.href.split('#')[0] } });
        if (result.error) throw result.error;
        if (!result.data.session) { authMode = 'login'; renderLogin('Cuenta creada. Revisa tu correo y confirma la dirección antes de iniciar sesión.'); return; }
      } else if (authMode === 'login') {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
        if (result.error) throw result.error;
      } else if (authMode === 'recover') {
        result = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
        if (result.error) throw result.error;
        authMode = 'login'; renderLogin('Si la dirección está registrada, recibirás un correo con el enlace para cambiar la contraseña.'); return;
      } else if (authMode === 'reset') {
        if (password.length < 10) throw new Error('La contraseña debe tener al menos 10 caracteres.');
        result = await supabaseClient.auth.updateUser({ password });
        if (result.error) throw result.error;
        authMode = 'login';
        renderLogin('Contraseña actualizada. Ya puedes entrar con tu nueva contraseña.'); return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      authSession = session; sessionEmail = session?.user?.email || null;
      if (session) { await initApp(); }
    } catch (err) {
      renderLogin(err.message || 'No se ha podido completar la operación.');
    }
  };
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-auth-mode]');
  if (!b) return;
  authMode = b.dataset.authMode;
  renderLogin();
});

async function initApp() {
  const { data, error } = await supabaseClient.auth.getSession();
  if (error || !data.session) {
    authSession = null; sessionEmail = null; renderLogin(); return;
  }
  authSession = data.session;
  sessionEmail = data.session.user.email || null;
  $('#topbar').style.display = 'flex';
  await loadData();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  authSession = session;
  sessionEmail = session?.user?.email || null;
  if (event === 'PASSWORD_RECOVERY') {
    authMode = 'reset';
    renderLogin();
  } else if (!session) {
    authMode = 'login';
    renderLogin();
  }
});

function calcAlumno(p, a){
  const asg = DB.asignaciones.filter(x=>x.alumno_id===a.id);
  let pts = 0;
  const detalle = asg.map(x=>{
    const rol = DB.roles.find(r=>r.id===x.rol_id);
    const peso = rol ? Number(rol.peso_base)||0 : 0;
    const fi = x.intensidad==='principal' ? 1 : x.intensidad==='secundario' ? 0.6 : 0.3;
    const fv = x.valoracion==='bien' ? 1 : x.valoracion==='aceptable' ? 0.5 : 0;
    const pto = peso*fi*fv;
    pts += pto;
    return {...x, rolNombre: rol ? rol.nombre : '(rol borrado)', peso, pto};
  });
  const faltasNJ = DB.faltas.filter(f=>f.alumno_id===a.id && !f.justificada).length;
  const penal = faltasNJ * (Number(p.penalizacion_falta)||0);
  return {asg:detalle, pts:Math.max(0, pts-penal), faltasNJ, penal};
}

function calcGrupo(p){
  const als = DB.alumnos.filter(a=>a.proyecto_id===p.id);
  const base = als.map(a=>({alumno:a, ...calcAlumno(p,a)}));
  const maxPts = base.length ? Math.max(...base.map(b=>b.pts)) : 0;
  const techo = Number(p.techo_referencia)||12;
  const pr = Number(p.peso_roles)||0.7, pa = Number(p.peso_ajuste)||0.3;
  return base.map(b=>{
    const notaTecho = Math.min(10, (b.pts/techo)*10);
    const notaNorm = maxPts>0 ? (b.pts/maxPts)*10 : 0;
    const aj = DB.ajustes.find(x=>x.alumno_id===b.alumno.id);
    const ajN = aj ? Number(aj.nota) : null;
    const finalTecho = ajN===null ? notaTecho : pr*notaTecho + pa*ajN;
    const finalNorm  = ajN===null ? notaNorm  : pr*notaNorm  + pa*ajN;
    return {...b, notaTecho, notaNorm, ajuste:ajN, finalTecho, finalNorm};
  });
}

function eventoNombre(p, id){
  if(!id) return '—';
  const e = DB.eventos.find(x=>x.id===id);
  return e ? e.nombre : '—';
}

function printHTML(titulo, cuerpo){
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>
    @page{size:A4;margin:15mm}
    body{font-family:system-ui,Arial,sans-serif;color:#111;font-size:12px}
    h1{font-size:20px;margin:0 0 4px}
    h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
    table{width:100%;border-collapse:collapse;margin:6px 0}
    th,td{border:1px solid #bbb;padding:5px 6px;text-align:left;vertical-align:top}
    th{background:#f0f0f0;font-size:11px;text-transform:uppercase}
    .chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
    .c-green{background:#d7f5dd;color:#0b6b2a}
    .c-yellow{background:#fff3cd;color:#8a6100}
    .c-red{background:#fbdada;color:#9b1c1c}
    .muted{color:#666}.small{font-size:10px;color:#666}
  </style></head><body>${cuerpo}</body></html>`);
  w.document.close(); w.focus(); setTimeout(()=>w.print(), 300);
}

function imprimirFicha(p, a){
  const c = calcAlumno(p, a);
  const filas = c.asg.map(x=>`<tr>
    <td>${esc(x.rolNombre)}</td>
    <td>${esc(x.intensidad)}</td>
    <td><span class="chip ${x.valoracion==='bien'?'c-green':x.valoracion==='aceptable'?'c-yellow':'c-red'}">${esc(x.valoracion)}</span></td>
    <td>${esc(x.notas||'')}</td></tr>`).join('');
  const html = `
    <h1>${esc(a.nombre)}</h1>
    <div class="muted">${esc(p.nombre)} · ${esc(a.curso||'')} ${esc(a.grupo||'')} · ${hoy()}</div>
    <h2>Roles</h2>
    <table><thead><tr><th>Rol</th><th>Intensidad</th><th>Valoración</th><th>Observaciones</th></tr></thead>
    <tbody>${filas || '<tr><td colspan="4">Sin roles asignados</td></tr>'}</tbody></table>
    ${c.faltasNJ>0 ? `<p><strong>Faltas no justificadas:</strong> ${c.faltasNJ}</p>` : ''}
    ${a.notas_ficha ? `<h2>Observaciones</h2><p>${esc(a.notas_ficha).replace(/\n/g,'<br>')}</p>` : ''}`;
  printHTML('Ficha de '+a.nombre, html);
}

function imprimirComparativa(p){
  const g = calcGrupo(p);
  const metodo = p.metodo_nota||'techo';
  const filas = g.sort((x,y)=> (metodo==='techo'? y.finalTecho-x.finalTecho : y.finalNorm-x.finalNorm)).map(r=>`
    <tr><td>${esc(r.alumno.nombre)}</td><td>${r.pts.toFixed(1)}</td>
    <td><span class="chip ${colorClass(r.notaTecho)}">${r.notaTecho.toFixed(1)}</span></td>
    <td><span class="chip ${colorClass(r.notaNorm)}">${r.notaNorm.toFixed(1)}</span></td>
    <td>${r.ajuste===null?'—':r.ajuste}</td>
    <td><span class="chip ${colorClass(r.finalTecho)}">${r.finalTecho.toFixed(1)}</span></td>
    <td><span class="chip ${colorClass(r.finalNorm)}">${r.finalNorm.toFixed(1)}</span></td></tr>`).join('');
  const html = `<h1>Comparativa · ${esc(p.nombre)}</h1>
    <div class="muted">Método activo: ${metodo} · Techo: ${p.techo_referencia} · Pesos: ${p.peso_roles}/${p.peso_ajuste} · ${hoy()}</div>
    <table><thead><tr><th>Alumno</th><th>Puntos</th><th>Nota roles (techo)</th><th>Nota roles (norm.)</th><th>Ajuste</th><th>Final (techo)</th><th>Final (norm.)</th></tr></thead>
    <tbody>${filas||'<tr><td colspan="7">Sin alumnos</td></tr>'}</tbody></table>
    <p class="small">Uso interno del profesorado. No distribuir al alumnado.</p>`;
  printHTML('Comparativa '+p.nombre, html);
}

function render(){
  const p = view.proyectoId ? DB.proyectos.find(x=>x.id===view.proyectoId) : null;
  $('#topbar-title').textContent = p ? p.nombre : 'Registro de Producción Escénica';
  const app = $('#app');
  if(view.name==='proyectos') app.innerHTML = renderProyectos();
  else if(view.name==='proyecto') app.innerHTML = renderProyecto(p);
  else if(view.name==='alumnos') app.innerHTML = renderAlumnos(p);
  else if(view.name==='alumno') app.innerHTML = renderAlumno(p, DB.alumnos.find(a=>a.id===view.alumnoId));
  else if(view.name==='comparativa') app.innerHTML = renderComparativa(p);
  window.scrollTo(0,0);
}

function renderProyectos(){
  return `<h1>Proyectos</h1>
  <details><summary>+ Nuevo proyecto</summary>
    <form data-action="crear-proyecto">
      <div class="grid2">
        <label>Nombre<input name="nombre" required placeholder="Burlesque 2026-27"></label>
        <label>Curso<select name="curso">
          <option value="4ESO">4º ESO</option><option value="1BACH">1º Bachillerato</option><option value="otro">Otro</option>
        </select></label>
        <label>Optativa<input name="optativa" placeholder="Creaciones escénico-musicales"></label>
        <label>Inicio<input type="date" name="fecha_inicio" value="${hoy()}"></label>
        <label>Fin<input type="date" name="fecha_fin"></label>
      </div>
      <div class="row"><button class="btn" type="submit">Crear proyecto</button></div>
    </form>
  </details>
  <div class="grid">
    ${DB.proyectos.length ? DB.proyectos.map(p=>`
      <div class="pcard">
        <h3>${esc(p.nombre)}</h3>
        <div class="muted">${esc(p.curso)} · ${esc(p.optativa||'—')}</div>
        <div><span class="pill">${p.estado==='activo'?'Activo':'Archivado'}</span></div>
        <div class="row" style="margin-top:auto;">
          <button class="btn sm" data-action="abrir-proyecto" data-id="${p.id}">Abrir</button>
          <button class="btn sm sec" data-action="archivar-proyecto" data-id="${p.id}">${p.estado==='activo'?'Archivar':'Reactivar'}</button>
          <button class="btn sm danger" data-action="borrar-proyecto" data-id="${p.id}">Borrar</button>
        </div>
      </div>`).join('') : '<div class="card muted">Todavía no hay proyectos. Crea el primero arriba.</div>'}
  </div>`;
}

function renderProyecto(p){
  if(!p) return '<div class="card">Proyecto no encontrado.</div>';
  const eventos = DB.eventos.filter(e=>e.proyecto_id===p.id);
  const roles = DB.roles.filter(r=>r.proyecto_id===p.id);
  const nAl = DB.alumnos.filter(a=>a.proyecto_id===p.id).length;
  return `<h1>${esc(p.nombre)}</h1>
  <div class="row" style="margin-bottom:20px">
    <button class="btn" data-action="ver-alumnos" style="background:var(--ink);">Alumnos (${nAl})</button>
    <button class="btn" data-action="ver-comparativa" style="background:var(--ink);">Comparativa</button>
  </div>

  <h2>Datos del proyecto</h2>
  <form class="card" data-action="guardar-proyecto">

}

function renderTablaEventos(eventos){
  if(!eventos.length) return '<div class="card muted">Sin eventos todavía.</div>';
  return `<table><thead><tr><th>Evento</th><th>Tipo</th><th>T</th><th>Fecha</th><th>Sede</th><th>Formato</th><th>Estado</th><th></th></tr></thead><tbody>
  ${eventos.map(e=>`<tr>
    <td><strong>${esc(e.nombre)}</strong></td>
    <td>${esc(TIPO_EVENTO[e.tipo]||e.tipo)}</td>
    <td>${esc(e.trimestre)}</td>
    <td>${esc(e.fecha)}</td>
    <td>${esc(e.sede||'—')}</td>
    <td>${e.formato==='completo'?'Completo':'Fragmento'}</td>
    <td><span class="pill">${esc(e.estado)}</span></td>
    <td><button class="btn sm danger" type="button" data-action="del-evento" data-id="${e.id}">×</button></td>
  </tr>`).join('')}</tbody></table>`;
}

function renderTablaRoles(roles){
  if(!roles.length) return '<div class="card muted">Sin roles.</div>';
  return `<table><thead><tr><th>Rol</th><th>Peso base</th><th>Tipo</th><th></th></tr></thead><tbody>
  ${roles.map(r=>`<tr>
    <td>${r.es_libre?`<input data-rol-id="${r.id}" data-rol-field="nombre" value="${esc(r.nombre)}" style="padding:6px;">`:esc(r.nombre)}</td>
    <td><input type="number" step="0.5" min="0" style="max-width:90px;padding:6px;" data-rol-id="${r.id}" data-rol-field="peso_base" value="${Number(r.peso_base)}"></td>
    <td>${r.es_libre?'<span class="pill">Libre</span>':'<span class="muted">Fijo</span>'}</td>
    <td>${r.es_libre?`<button class="btn sm danger" type="button" data-action="del-rol" data-id="${r.id}">Borrar</button>`:''}</td>
  </tr>`).join('')}</tbody></table>`;
}

function renderAlumnos(p){

  const rows = als.map(a=>{
    const r = g.find(x=>x.alumno.id===a.id);
    const final = p.metodo_nota==='normalizada' ? r.finalNorm : r.finalTecho;
    return `<tr>
      <td><a href="#" data-action="abrir-alumno" data-id="${a.id}">${esc(a.nombre)}</a></td>
      <td>${esc(a.curso||'')}</td>
      <td>${esc(a.grupo||'')}</td>
      <td><span class="pill">${r.asg.length}</span></td>
      <td>${r.pts.toFixed(1)}</td>
      <td><span class="chip ${colorClass(final)}">${final.toFixed(1)}</span></td>
      <td><button class="btn sm danger" type="button" data-action="del-alumno" data-id="${a.id}">×</button></td>

    <button class="btn sec" data-action="abrir-proyecto" data-id="${p.id}">← Volver al proyecto</button>

function renderComparativa(p){
  const g = calcGrupo(p);
  const metodo = p.metodo_nota || 'techo';
  const orden = [...g].sort((x,y)=> metodo==='techo' ? y.finalTecho-x.finalTecho : y.finalNorm-x.finalNorm);
  const filas = orden.map(r=>`<tr>
    <td><a href="#" data-action="abrir-alumno" data-id="${r.alumno.id}">${esc(r.alumno.nombre)}</a></td>
    <td>${r.pts.toFixed(1)}</td>
    <td><span class="chip ${colorClass(r.notaTecho)}">${r.notaTecho.toFixed(1)}</span></td>
    <td><span class="chip ${colorClass(r.notaNorm)}">${r.notaNorm.toFixed(1)}</span></td>
    <td>${r.ajuste===null?'—':r.ajuste}</td>
    <td><span class="chip ${colorClass(r.finalTecho)}">${r.finalTecho.toFixed(1)} ${metodo==='techo'?'★':''}</span></td>
    <td><span class="chip ${colorClass(r.finalNorm)}">${r.finalNorm.toFixed(1)} ${metodo==='normalizada'?'★':''}</span></td>
  </tr>`).join('');
  return `<h1>Comparativa · ${esc(p.nombre)}</h1>
  <div class="row" style="margin-bottom:20px">
    <button class="btn sec" data-action="abrir-proyecto" data-id="${p.id}">← Volver al proyecto</button>
    <button class="btn sec" data-action="ver-alumnos">Alumnos</button>
    <button class="btn" data-action="imprimir-comparativa" style="background:var(--ink);">🖨 Imprimir comparativa</button>
  </div>
  <div class="card muted" style="background:#f8fafc;">Método activo: <strong>${metodo}</strong> · Techo: ${p.techo_referencia} · Pesos: ${p.peso_roles} / ${p.peso_ajuste} · Penalización falta: ${p.penalizacion_falta}</div>
  ${g.length ? `<table><thead><tr><th>Alumno</th><th>Puntos</th><th>Nota roles (techo)</th><th>Nota roles (norm.)</th><th>Ajuste</th><th>Final (techo)</th><th>Final (norm.)</th></tr></thead><tbody>${filas}</tbody></table>` : '<div class="card muted">Sin alumnos.</div>'}
  <p class="muted" style="text-align:center;margin-top:20px;">Uso interno del profesorado. La ficha que se enseña al alumno es la individual, sin puntos ni comparativa.</p>`;
}

document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if(el.tagName === 'A') e.preventDefault();
  
  switch(act){
    case 'home': view={name:'proyectos',proyectoId:null,alumnoId:null}; render(); break;
    case 'abrir-proyecto': view={name:'proyecto',proyectoId:id,alumnoId:null}; render(); break;
    case 'ver-alumnos': view={name:'alumnos',proyectoId:view.proyectoId,alumnoId:null}; render(); break;
    case 'ver-comparativa': view={name:'comparativa',proyectoId:view.proyectoId,alumnoId:null}; render(); break;
    case 'abrir-alumno': view={name:'alumno',proyectoId:view.proyectoId,alumnoId:id}; render(); break;
    case 'imprimir-ficha': imprimirFicha(DB.proyectos.find(x=>x.id===view.proyectoId), DB.alumnos.find(x=>x.id===id)); break;
    case 'imprimir-comparativa': imprimirComparativa(DB.proyectos.find(x=>x.id===view.proyectoId)); break;
    
    case 'borrar-proyecto': 
      if(confirm('¿Borrar el proyecto y todos sus datos?')) { await supabaseClient.from('proyectos').delete().eq('id', id); view={name:'proyectos',proyectoId:null,alumnoId:null}; loadData(); } 
      break;
    case 'archivar-proyecto': {
      const p = DB.proyectos.find(x=>x.id===id);
      const nuevoEstado = p.estado==='activo'?'archivado':'activo';
      await supabaseClient.from('proyectos').update({estado: nuevoEstado}).eq('id', id); loadData(); break;
    }
    case 'del-alumno': if(confirm('¿Borrar alumno y todos sus datos?')) { await supabaseClient.from('alumnos').delete().eq('id', id); loadData(); } break;
    case 'del-asignacion': await supabaseClient.from('asignaciones').delete().eq('id', id); loadData(); break;
    case 'del-falta': await supabaseClient.from('faltas').delete().eq('id', id); loadData(); break;
    case 'del-evento': if(confirm('¿Borrar evento?')) { await supabaseClient.from('eventos').delete().eq('id', id); loadData(); } break;
    case 'del-rol': {
      if(DB.asignaciones.some(x=>x.rol_id===id)) { alert('No se puede borrar: hay asignaciones con este rol.'); break; }
      await supabaseClient.from('roles').delete().eq('id', id); loadData(); break;
    }
    case 'add-rol-libre': {
      const n = DB.roles.filter(r=>r.proyecto_id===view.proyectoId && r.es_libre).length + 1;
      await supabaseClient.from('roles').insert([{id: uid(), proyecto_id:view.proyectoId, nombre:'Rol libre '+n, peso_base:1, es_libre:true}]);
      loadData(); break;
    }
  }
});

document.addEventListener('change', async e=>{
  const el = e.target.closest('[data-rol-field]');
  if(!el) return;
  const val = el.dataset.rolField === 'peso_base' ? Number(el.value) : el.value;
  await supabaseClient.from('roles').update({[el.dataset.rolField]: val}).eq('id', el.dataset.rolId);
  loadData();
});

document.addEventListener('submit', async e=>{
  const f = e.target.closest('form[data-action]');
  if(!f) return;
  e.preventDefault();
  const act = f.dataset.action;
  const fd = Object.fromEntries(new FormData(f).entries());
  const p = DB.proyectos.find(x=>x.id===view.proyectoId);

  switch(act){
    case 'crear-proyecto': {
      const pid = uid();
      const { error: projectError } = await supabaseClient.from('proyectos').insert([{
        id:pid, owner_id:authSession.user.id, nombre:fd.nombre, curso:fd.curso, optativa:fd.optativa,
        fecha_inicio:fd.fecha_inicio || null, fecha_fin:fd.fecha_fin || null, estado:'activo',
        techo_referencia:12, metodo_nota:'techo', peso_roles:0.7, peso_ajuste:0.3, penalizacion_falta:0.5
      }]);
      if (projectError) { alert('No se pudo guardar el proyecto: ' + projectError.message); break; }
      const roles = ROLES_DEFECTO.map(r => ({id:uid(), proyecto_id:pid, nombre:r[0], peso_base:r[1], es_libre:false}));
      roles.push({id:uid(), proyecto_id:pid, nombre:'Rol libre 1', peso_base:1, es_libre:true});
      roles.push({id:uid(), proyecto_id:pid, nombre:'Rol libre 2', peso_base:1, es_libre:true});
      await supabaseClient.from('roles').insert(roles);
      view = {name:'proyecto', proyectoId:pid, alumnoId:null}; loadData(); break;
    }
    case 'guardar-proyecto':
      await supabaseClient.from('proyectos').update({
        nombre:fd.nombre, curso:fd.curso, optativa:fd.optativa, fecha_inicio:fd.fecha_inicio, fecha_fin:fd.fecha_fin, notas:fd.notas
      }).eq('id', p.id); loadData(); break;
    case 'guardar-ajustes':
      await supabaseClient.from('proyectos').update({
        techo_referencia:Number(fd.techo_referencia), metodo_nota:fd.metodo_nota, peso_roles:Number(fd.peso_roles), peso_ajuste:Number(fd.peso_ajuste), penalizacion_falta:Number(fd.penalizacion_falta)
      }).eq('id', p.id); loadData(); break;
    case 'add-evento':
      await supabaseClient.from('eventos').insert([{
        id:uid(), proyecto_id:p.id, nombre:fd.nombre, tipo:fd.tipo, trimestre:fd.trimestre, fecha:fd.fecha, sede:fd.sede, formato:fd.formato, estado:fd.estado, notas:fd.notas
      }]); loadData(); break;
    case 'add-alumno':
      await supabaseClient.from('alumnos').insert([{
        id:uid(), proyecto_id:p.id, nombre:fd.nombre, curso:fd.curso, grupo:fd.grupo
      }]); loadData(); break;
    case 'add-asignacion':
      await supabaseClient.from('asignaciones').insert([{
        id:uid(), proyecto_id:p.id, alumno_id:view.alumnoId, rol_id:fd.rol_id, intensidad:fd.intensidad, valoracion:fd.valoracion, trimestre:fd.trimestre, evento_id:fd.evento_id||null, notas:fd.notas
      }]); loadData(); break;
    case 'add-falta':
      await supabaseClient.from('faltas').insert([{
        id:uid(), proyecto_id:p.id, alumno_id:view.alumnoId, fecha:fd.fecha, tipo:fd.tipo, justificada:(fd.justificada==='si')
      }]); loadData(); break;
    case 'guardar-notas':
      await supabaseClient.from('alumnos').update({notas_privadas:fd.notas_privadas, notas_ficha:fd.notas_ficha}).eq('id', view.alumnoId);
      alert('Notas guardadas'); loadData(); break;
    case 'guardar-ajuste': {
      let aj = DB.ajustes.find(x=>x.alumno_id===view.alumnoId);
      if(!aj) await supabaseClient.from('ajustes').insert([{id:uid(), proyecto_id:p.id, alumno_id:view.alumnoId, nota:Number(fd.nota), comentario:fd.comentario}]);
      else await supabaseClient.from('ajustes').update({nota:Number(fd.nota), comentario:fd.comentario}).eq('id', aj.id);
      loadData(); break;
    }
    case 'guardar-colab': {
      let c = DB.colaboraciones.find(x=>x.alumno_id===view.alumnoId);
      if(!c) await supabaseClient.from('colaboraciones').insert([{id:uid(), proyecto_id:p.id, alumno_id:view.alumnoId, estado:fd.estado, notas:fd.notas}]);
      else await supabaseClient.from('colaboraciones').update({estado:fd.estado, notas:fd.notas}).eq('id', c.id);
      alert('Guardado'); loadData(); break;
    }
  }
});

$('#btn-home').addEventListener('click', ()=>{ view={name:'proyectos',proyectoId:null,alumnoId:null}; render(); });
$('#btn-logout').addEventListener('click', async ()=>{ await supabaseClient.auth.signOut(); authSession = null; sessionEmail = null; authMode = 'login'; renderLogin(); });

initApp();
</script>
